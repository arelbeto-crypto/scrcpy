name: POCO Live Camera AR Filters V7

on:
  push:
    branches: [camera-ar-filters-poco-v7]
  workflow_dispatch:

env:
  VERSION: camera-ar-filters-poco-v7

jobs:
  build-server:
    runs-on: ubuntu-latest
    env:
      GRADLE: gradle
    steps:
      - uses: actions/checkout@v6
      - name: Apply POCO V6 native filter patch
        run: python3 release/poco/APPLY_V6_FILTER_PATCH.py
      - name: Apply POCO V7 AR overlay patch
        run: python3 release/poco/APPLY_V7_AR_PATCH.py
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Build scrcpy server
        run: release/build_server.sh
      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-server-camera-v7
          path: release/work/build-server/server/scrcpy-server

  build-win64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply POCO V6 native filter patch
        run: python3 release/poco/APPLY_V6_FILTER_PATCH.py
      - name: Apply POCO V7 AR overlay patch
        run: python3 release/poco/APPLY_V7_AR_PATCH.py
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build nasm mingw-w64 mingw-w64-tools libz-mingw-w64-dev
      - uses: actions/cache@v4
        with:
          path: app/deps/work
          key: poco-win64-deps-${{ hashFiles('app/deps/*.sh', 'app/deps/_*', 'cross_win64.txt') }}
      - name: Build Windows x64 client
        run: release/build_windows.sh 64
      - name: Pack intermediate client
        run: |
          cd release/work/build-win64
          mkdir dist-tar
          tar -C . -cvf dist-tar/dist.tar.gz dist/
      - uses: actions/upload-artifact@v7
        with:
          name: build-win64-camera-v7
          path: release/work/build-win64/dist-tar/

  package-win64:
    needs: [build-server, build-win64, test-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-server-camera-v7
          path: release/work/build-server/server/
      - uses: actions/download-artifact@v8
        with:
          name: build-win64-camera-v7
          path: release/work/build-win64/dist-tar/
      - name: Assemble portable Windows package
        run: |
          cd release/work/build-win64
          tar xf dist-tar/dist.tar.gz
          cd ../../..
          cp release/poco/* release/work/build-win64/dist/
          printf '%s\n' "Commit: $GITHUB_SHA" "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "Package: scrcpy-camera-ar-filters-poco-v7-win64" "Runtime patches: release/poco/APPLY_V6_FILTER_PATCH.py + release/poco/APPLY_V7_AR_PATCH.py" > release/work/build-win64/dist/BUILD_INFO.txt
          release/package_client.sh win64 zip
      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-camera-ar-filters-poco-v7-win64
          path: release/output/

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply POCO V6 native filter patch
        run: python3 release/poco/APPLY_V6_FILTER_PATCH.py
      - name: Apply POCO V7 AR overlay patch
        run: python3 release/poco/APPLY_V7_AR_PATCH.py
      - name: Install native test dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build cmake nasm pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libavdevice-dev libusb-1.0-0-dev libv4l-dev libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev libwayland-dev libdecor-0-dev liburing-dev
      - uses: actions/cache@v4
        with:
          path: app/deps/work
          key: poco-native-sdl-${{ hashFiles('app/deps/sdl.sh', 'app/deps/_*') }}
      - name: Install SDL3
        run: app/deps/sdl.sh linux native shared
      - name: Test client with sanitizers
        run: |
          export PKG_CONFIG_PATH="$PWD/app/deps/work/install/linux-native-shared/lib/pkgconfig"
          export LD_LIBRARY_PATH="$PWD/app/deps/work/install/linux-native-shared/lib"
          release/test_client.sh

  smoke-windows:
    needs: package-win64
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-camera-ar-filters-poco-v7-win64
          path: package
      - name: Check portable executable and POCO tools
        shell: pwsh
        run: |
          $archive = Get-ChildItem package -Filter *.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Recurse -Filter scrcpy.exe | Select-Object -First 1
          $version = & $exe.FullName --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '4.1-poco7') { throw "scrcpy failed to start: $version" }
          $help = & $exe.FullName --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'camera-focus-distance') { throw 'Camera options missing' }
          $tokens = $null
          $parseErrors = $null
          foreach ($scriptName in @('ELEGIR_LENTE.ps1', 'POCO_MENU.ps1', 'DIAGNOSTICO_POCO_COMPLETO.ps1')) {
            $scriptPath = Join-Path $exe.DirectoryName $scriptName
            if (-not (Test-Path -LiteralPath $scriptPath)) { throw "$scriptName missing" }
            $null = [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          foreach ($fileName in @('POCO_MENU.bat', 'DIAGNOSTICO_POCO_COMPLETO.bat', 'PERFIL_LIVE_ESTABLE.bat', 'APPLY_V6_FILTER_PATCH.py', 'APPLY_V7_AR_PATCH.py', 'CONTROLES_POCO.txt', 'CONTROLES_AR_V7.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $exe.DirectoryName $fileName))) { throw "$fileName missing" }
          }
          $nativeManual = Get-Content -LiteralPath (Join-Path $exe.DirectoryName 'CONTROLES_POCO.txt') -Raw
          if ($nativeManual -notmatch 'Alt \+ 1\.\.9' -or $nativeManual -notmatch 'SEPIA' -or $nativeManual -notmatch 'AQUA') { throw 'V6 native filter shortcuts missing from manual' }
          $arManual = Get-Content -LiteralPath (Join-Path $exe.DirectoryName 'CONTROLES_AR_V7.txt') -Raw
          if ($arManual -notmatch 'Alt \+ Y' -or $arManual -notmatch 'GLASSES' -or $arManual -notmatch 'CROWN') { throw 'V7 AR overlay shortcuts missing from manual' }
          Write-Host $version
          Write-Host 'Portable Windows executable, native filters, AR overlays, POCO menu, diagnostics and presets verified.'
