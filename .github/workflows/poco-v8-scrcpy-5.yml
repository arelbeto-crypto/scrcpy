name: POCO V8 scrcpy 5.0.1 Camera AR Windows

on:
  push:
    branches: [camera-ar-filters-poco-v8-scrcpy-5.0.1]
    paths:
      - 'release/poco/APPLY_V8_AR_PATCH.py'
      - 'release/poco/POCO_V8_MENU.ps1'
      - 'release/poco/POCO_V8_MENU.bat'
      - 'release/poco/CONTROLES_AR_V8.txt'
      - '.github/workflows/poco-v8-scrcpy-5.yml'
  workflow_dispatch:

jobs:
  build-win64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Fetch custom POCO V8 files
        uses: actions/checkout@v6
        with:
          path: custom
      - name: Fetch official scrcpy 5.0.1 source
        uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          ref: v5.0.1
          path: scrcpy5
          persist-credentials: false
      - name: Port POCO V7 AR overlay to scrcpy 5.0.1
        run: |
          mkdir -p scrcpy5/release/poco
          cp custom/release/poco/APPLY_V8_AR_PATCH.py scrcpy5/release/poco/
          cd scrcpy5
          python3 release/poco/APPLY_V8_AR_PATCH.py
          grep -q 'POCO V8 AR shortcuts' app/src/input_manager.c
          grep -q 'sc_screen_render_camera_ar_overlay' app/src/screen.c
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: scrcpy5/**/*.gradle*
      - name: Install native cross-compile tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm mingw-w64 mingw-w64-tools libz-mingw-w64-dev
      - uses: actions/cache@v4
        with:
          path: scrcpy5/app/deps/work
          key: poco-v8-scrcpy501-win64-${{ hashFiles('scrcpy5/app/deps/*.sh', 'scrcpy5/app/deps/_*', 'scrcpy5/cross_win64.txt') }}
      - name: Build Android server and Windows client from identical upstream release
        working-directory: scrcpy5
        run: |
          chmod +x gradlew
          release/build_server.sh
          release/build_windows.sh 64
      - name: Package portable Windows V8
        working-directory: scrcpy5
        env:
          VERSION: 5.0.1-poco8-ar
        run: |
          cp ../custom/release/poco/POCO_V8_MENU.ps1 release/work/build-win64/dist/
          cp ../custom/release/poco/POCO_V8_MENU.bat release/work/build-win64/dist/
          cp ../custom/release/poco/CONTROLES_AR_V8.txt release/work/build-win64/dist/
          printf '%s\n' 'Base: upstream scrcpy v5.0.1' 'Customization: POCO V8 static camera AR overlay' 'Camera2 manual ISO/focus/exposure from V7: not ported' "Commit: ${GITHUB_SHA}" "Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > release/work/build-win64/dist/BUILD_INFO_V8.txt
          release/package_client.sh win64 zip
      - uses: actions/upload-artifact@v7
        with:
          name: scrcpy-camera-ar-poco-v8-scrcpy-5.0.1-win64
          path: scrcpy5/release/output/*.zip
          if-no-files-found: error
          retention-days: 90

  smoke-windows:
    needs: build-win64
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-camera-ar-poco-v8-scrcpy-5.0.1-win64
          path: package
      - name: Verify portable EXE version and menu syntax
        shell: pwsh
        run: |
          $zip = Get-ChildItem package -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP missing' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Recurse -Filter scrcpy.exe | Select-Object -First 1
          if (-not $exe) { throw 'scrcpy.exe missing' }
          $version = & $exe.FullName --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '5\.0\.1') { throw "Version mismatch: $version" }
          $help = & $exe.FullName --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'hwdec') { throw 'scrcpy 5 hardware decode option missing' }
          foreach ($f in @('scrcpy-server', 'POCO_V8_MENU.ps1', 'POCO_V8_MENU.bat', 'CONTROLES_AR_V8.txt', 'BUILD_INFO_V8.txt')) {
            if (!(Test-Path (Join-Path $exe.DirectoryName $f))) { throw "$f missing" }
          }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $exe.DirectoryName 'POCO_V8_MENU.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          Write-Host $version
          Write-Host 'V8 Windows packaging smoke test passed'
