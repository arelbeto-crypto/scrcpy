name: POCO V8.9 Open Masks and Native Model Verification
on:
  push:
    branches: [camera-vision-v89-open-masks]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          path: custom
      - uses: actions/checkout@v6
        with:
          repository: Genymobile/scrcpy
          ref: v5.0.1
          path: scrcpy5
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: redmi-vision-v89-debug-keystore-v1
      - name: Install GPU validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgles2 libgl1-mesa-dri glslang-tools
          python3 -m pip install pillow cairosvg
      - name: Verify pinned models, generated assets, controllers and pixels
        working-directory: custom
        run: |
          python3 release/poco/download_vision_models.py
          python3 release/poco/build_face_topology.py --check
          python3 release/poco/tests/mask_assets_test.py
          bash release/poco/tests/run.sh
          python3 release/poco/tests/shader_pixels.py
          glslangValidator -l release/poco/v84/shaders/composite.vert release/poco/v84/shaders/composite.frag
          glslangValidator -l release/poco/v84/shaders/mesh.vert release/poco/v84/shaders/mesh.frag
          python3 release/poco/build_vision_shaders.py --check
      - name: Build APK and matching POCO server
        run: |
          mkdir -p scrcpy5/release/poco
          cp custom/release/poco/APPLY_V8_AR_PATCH.py custom/release/poco/APPLY_V8_CAMERA_PRO_PATCH.py custom/release/poco/APPLY_V84_REMOTE_VISION_PATCH.py scrcpy5/release/poco/
          cp -r custom/release/poco/v84 custom/release/poco/common scrcpy5/release/poco/
          cd scrcpy5
          python3 release/poco/APPLY_V8_AR_PATCH.py
          python3 release/poco/APPLY_V8_CAMERA_PRO_PATCH.py
          python3 release/poco/APPLY_V84_REMOTE_VISION_PATCH.py
          chmod +x gradlew ../custom/gradlew
          ./gradlew -p server assembleRelease
          ../custom/gradlew -p ../custom/release/poco/redmi-vision :app:assembleRelease :app:dependencies --configuration releaseRuntimeClasspath > ../android-build.txt 2>&1 || { tail -n 160 ../android-build.txt; exit 1; }
          mkdir -p ../output
          cp server/build/outputs/apk/release/server-release-unsigned.apk ../output/scrcpy-server
          cp ../custom/release/poco/redmi-vision/app/build/outputs/apk/release/app-release.apk ../output/RedmiVision-V8.9.apk
          cp ../android-build.txt ../output/DEPENDENCIAS_V89.txt
          build_tools=$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose --print-certs ../output/RedmiVision-V8.9.apk > ../output/APK_VERIFICACION_V89.txt
          "$build_tools/zipalign" -c -P 16 -v 4 ../output/RedmiVision-V8.9.apk > ../output/APK_ALINEACION_V89.txt
          "$build_tools/aapt" dump badging ../output/RedmiVision-V8.9.apk > ../output/APK_COMPONENTES_V89.txt
          grep -q "package: name='com.poco.visioncoprocessor.v89'" ../output/APK_COMPONENTES_V89.txt
          grep -q "launchable-activity: name='com.poco.visioncoprocessor.MainActivity'" ../output/APK_COMPONENTES_V89.txt
          if grep -q 'com.google.mlkit:' ../output/DEPENDENCIAS_V89.txt; then echo 'Unexpected proprietary ML Kit dependency'; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: poco-v89-android-build
          path: output/*
          if-no-files-found: error
          retention-days: 90

  android-runtime:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: poco-v89-android-build
          path: output
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 release/poco/tests/android_smoke.py output/RedmiVision-V8.9.apk com.poco.visioncoprocessor.v89
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: poco-v89-android-runtime-logs
          path: |
            release/poco/tests/android-*-logcat.txt
            release/poco/tests/android-v89-mesh.json
          retention-days: 90

  windows-package:
    needs: [build, android-runtime]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: poco-v89-android-build
          path: output
      - uses: actions/download-artifact@v8
        with:
          name: scrcpy-camera-ar-poco-v87-redmi-vision-scrcpy-5.0.1-win64
          run-id: 39278220998
          github-token: ${{ github.token }}
          path: baseline
      - name: Package Windows and verify matching APK
        shell: pwsh
        run: |
          $zip = Get-ChildItem baseline -Filter *.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath unpacked
          $exe = Get-ChildItem unpacked -Recurse -Filter scrcpy.exe | Select-Object -First 1
          $dest = $exe.DirectoryName
          Copy-Item output/scrcpy-server $dest -Force
          Copy-Item output/RedmiVision-V8.9.apk (Join-Path $dest 'RedmiVisionCoprocessor.apk') -Force
          Copy-Item output/*V89.txt $dest
          Copy-Item release/poco/INSTALAR_REDMI_VISION.ps1 $dest -Force
          Copy-Item release/poco/CONTROLES_AR_V89.txt $dest -Force
          Copy-Item release/poco/LICENCIAS_V89.txt $dest -Force
          New-Item -ItemType Directory -Force (Join-Path $dest 'LICENSES') | Out-Null
          Copy-Item release/poco/assets/upstream/MEDIAPIPE-LICENSE.txt (Join-Path $dest 'LICENSES/MEDIAPIPE-APACHE-2.0.txt') -Force
          Copy-Item release/poco/assets/masks/LICENSE.txt (Join-Path $dest 'LICENSES/MASKS-CC0.txt') -Force
          Copy-Item release/poco/POCO_V8_MENU.ps1 $dest -Force
          $version = & $exe.FullName --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '5\.0\.1') { throw $version }
          foreach ($file in @('INSTALAR_REDMI_VISION.ps1','POCO_V8_MENU.ps1')) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $dest $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          if ((Get-FileHash output/RedmiVision-V8.9.apk).Hash -ne (Get-FileHash (Join-Path $dest 'RedmiVisionCoprocessor.apk')).Hash) { throw 'APK mismatch' }
          $menu = Get-Content (Join-Path $dest 'POCO_V8_MENU.ps1') -Raw
          if ($menu -notmatch '--hwdec=disabled' -or $menu -notmatch "'4' \{ Camera '3'") { throw 'Decoder/startup modes changed' }
          @('Base: scrcpy 5.0.1; Windows EXE preserved', 'V8.9: open-source MediaPipe models and mesh-textured masks', "Commit: $env:GITHUB_SHA", 'Android runtime evidence: Android 16 emulator; real Android 17 device not measured') | Set-Content (Join-Path $dest 'BUILD_INFO_V8.txt')
          New-Item -ItemType Directory -Force deliverables | Out-Null
          Compress-Archive -Path "$dest/*" -DestinationPath deliverables/POCO-V8.9-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: poco-v89-windows
          path: deliverables/POCO-V8.9-Windows.zip
          retention-days: 90
