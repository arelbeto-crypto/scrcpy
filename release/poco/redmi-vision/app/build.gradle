plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.poco.visioncoprocessor'
    compileSdk = 36

    defaultConfig {
        // Preview installs alongside V8.6.1; its original signing key is not available here.
        applicationId = 'com.poco.visioncoprocessor.v89'
        minSdk = 24
        targetSdk = 33
        versionCode = 890
        versionName = '8.9'
    }

    sourceSets.main.java.srcDir '../../common/java'

    signingConfigs {
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Package Manager extracts compressed libraries instead of mapping them
    // directly from ZIP offsets. Validate both packaging and signatures in CI.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Both models are bundled: after installing the APK, inference does not
    // depend on Play Services downloading a model.
    implementation 'com.google.mediapipe:tasks-vision:1.1.1'
}
