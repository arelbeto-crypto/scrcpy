plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.poco.visioncoprocessor'
    compileSdk = 36

    defaultConfig {
        // Preview installs alongside V8.6.1; its original signing key is not available here.
        applicationId = 'com.poco.visioncoprocessor.v87'
        minSdk = 23
        targetSdk = 33
        versionCode = 870
        versionName = '8.7'
    }

    signingConfigs {
        debug {
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Both models are bundled: after installing the APK, inference does not
    // depend on Play Services downloading a model.
    implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta1'
}
